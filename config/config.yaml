# ---------------------------------------------------------------------------
# Central configuration. NOTHING downstream may hardcode a path or a model name.
# Every value here can be overridden by an environment variable using the
# pattern NEWSKG__<SECTION>__<KEY> (see .env.example).
# ---------------------------------------------------------------------------

paths:
  # All paths are resolved relative to the PROJECT ROOT, not the current
  # working directory, so scripts behave the same no matter where you run them.
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  db_path: data/knowledge_graph.db

ingestion:
  # The corpus we ingest from. Phase 1 uses a local, version-controlled corpus
  # so the whole pipeline is reproducible without a network or a scraper.
  source_file: data/sample/articles.jsonl
  # Drop articles whose body is shorter than this (boilerplate / failed fetches).
  min_body_chars: 120

preprocessing:
  # Unicode normalisation form. NFKC folds "compatibility" characters
  # (e.g. non-breaking space -> space, ﬁ ligature -> fi).
  unicode_form: NFKC
  strip_html: true
  # Sentence segmentation backend: "spacy" (better) or "regex" (zero-dependency
  # fallback). Configurable so the pipeline still runs if spaCy is unavailable.
  sentence_segmenter: spacy
  spacy_model: en_core_web_sm

ner:
  # Which extractors run, and in what order. Order does not affect the merge
  # result (the trust matrix decides that), but it does affect logging order.
  #   spacy       - fast, 18 types, the only model with EVENT, gives us the
  #                 dependency parse Phase 5 needs anyway.
  #   transformer - ~17x slower on CPU but clearly better on PERSON/ORG.
  #   gazetteer   - supplies COUNTRY, ROLE and TOPIC, which no model provides.
  # Drop "transformer" for a fast first pass over a large archive.
  extractors:
    - spacy
    - transformer
    - gazetteer

  transformer_model: dslim/bert-base-NER
  # -1 = CPU, 0 = first CUDA device.
  device: -1
  batch_size: 8
  # Confidence floor applied AFTER merging. 0.0 keeps everything; raise it to
  # trade recall for precision. Note this only filters model predictions
  # meaningfully -- rule-based scores are fixed constants, not probabilities.
  min_score: 0.0

coreference:
  # "fastcoref" = neural (LingMess, 590M params, ~81 F1 on OntoNotes).
  # "rules"     = heuristic baseline: no download, instant, clearly worse.
  backend: fastcoref
  # "lingmess" (accurate) or "fcoref" (distilled, faster, a few F1 lower).
  model: lingmess
  device: cpu
  batch_size: 4
  # Coreference is O(mentions^2). Truncate pathological documents rather than
  # letting one of them stall an entire batch.
  max_chars: 20000
  # Rules backend only: how many sentences back a pronoun may look.
  max_sentence_distance: 2

relations:
  # "pattern"    - juxtaposition relations (holds_position, represents,
  #                works_for). No verb exists for a parser to hang off.
  # "dependency" - verb-mediated relations (met, discussed, attended, signed)
  #                from spaCy's dependency parse, which we already compute.
  extractors:
    - pattern
    - dependency
  # Confidence floor applied after deduplication. Raise to trade recall for
  # precision; Phase 10 will tell you where to actually set this.
  min_confidence: 0.35

entity_resolution:
  # Context embeddings. Turn off for a fast, string-and-attribute-only run.
  use_embeddings: true
  embedding_model: intfloat/multilingual-e5-small
  # Decision bands. Deliberately conservative: a FALSE MERGE fuses two real
  # people permanently and corrupts every downstream fact, while a false split
  # only costs recall and is recoverable. Pairs between the two thresholds go
  # to a human review queue instead of being forced into a decision.
  match_threshold: 0.55
  review_threshold: 0.35

logging:
  level: INFO
  # "rich" for colourised human-readable console logs, "json" for machine-
  # parseable logs you would ship to a log aggregator in production.
  format: rich
